name: Validate Jangid Cricinfo

on:
  push:
    branches:
      - main
      - fix/scoring-one-screen-mobile-2026-11-09
  pull_request:
    branches:
      - main

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax, CSS and workflow checks
        run: node scripts/validate-static.mjs
