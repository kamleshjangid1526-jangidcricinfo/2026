<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jangid Cricinfo — Create Account</title><link rel="stylesheet" href="register.css"><link rel="stylesheet" href="theme.css"></head><body><main class="shell"><div class="registerTop"><div class="brand">🏏 JANGID CRICINFO</div><button class="themeToggle" type="button" data-theme-toggle>☀ Day mode</button></div><section class="card"><div class="eyebrow">CREATE ACCOUNT</div><h1>नया खाता बनाइए</h1><p class="muted">Registration के बाद आपका नाम, मोबाइल और account details सुरक्षित रहेंगी.</p><div class="grid2"><div><label>Full Name</label><input id="fullName" placeholder="पूरा नाम"></div><div><label>Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile"></div><div><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com" required></div><div><label>Address</label><input id="address" placeholder="पता"></div><div><label>Password</label><input id="password" type="password" minlength="8" placeholder="कम से कम 8 characters"></div><div><label>Confirm Password</label><input id="confirmPassword" type="password" minlength="8" placeholder="Password फिर से लिखें"></div></div><div id="msg" class="msg"></div><button id="createBtn" class="btn primary">Create Account</button><a class="back" href="control.html">← Back to Login</a></section></main><script src="firebase-api-loader.js?v=5.0.2"></script><script src="theme.js"></script><script src="register.js"></script><script type="module" src="firebase/firebase-api-bridge.mjs?v=5.1.1"></script></body></html>
